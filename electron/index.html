<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>CDXML 化合物解析</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="node_modules/smiles-drawer/dist/smiles-drawer.min.js"></script>
</head>
<body>
  <header class="header">
    <h1>CDXML 化合物解析</h1>
    <p class="sub">解析结果表格（结构式渲染）+ 未匹配项审查（Python + RDKit 后端）</p>
  </header>

  <section class="controls">
    <div class="controls-inner">
      <div class="control-group">
        <div class="control-row">
          <label for="pathCdxml">CDXML 文件</label>
          <input type="text" id="pathCdxml" readonly placeholder="点击浏览选择…" />
          <button type="button" id="btnBrowseCdxml" class="btn-compact">浏览…</button>
        </div>
        <div class="control-row">
          <label for="pathCsv">解析结果 CSV</label>
          <input type="text" id="pathCsv" readonly placeholder="导出时的默认路径（解析不写盘）" />
          <button type="button" id="btnBrowseCsv" class="btn-compact">另存为…</button>
        </div>
      </div>

      <details class="control-group control-group--params match-params" id="aiParamsDetails">
        <summary class="match-params-summary">
          <span class="match-params-title">AI 结构化</span>
          <span class="match-params-hint">API Key、提示词</span>
        </summary>
        <div class="match-params-body">
          <div class="control-field">
            <div class="control-row control-row--inputs">
              <label for="aiBaseUrl">API Base URL</label>
              <input type="text" id="aiBaseUrl" class="input-wide" value="https://api.openai.com/v1" spellcheck="false" />
            </div>
          </div>
          <div class="control-field">
            <div class="control-row control-row--inputs">
              <label for="aiApiKey">API Key</label>
              <input type="password" id="aiApiKey" class="input-wide" autocomplete="off" placeholder="保存于本机用户目录" />
            </div>
          </div>
          <div class="control-field">
            <div class="control-row control-row--inputs">
              <label for="aiModel">Model</label>
              <input type="text" id="aiModel" value="gpt-4o-mini" spellcheck="false" />
              <label class="inline-num-label" for="aiConcurrency">并发</label>
              <input type="number" id="aiConcurrency" min="1" max="10" step="1" value="3" style="width:4rem" />
            </div>
          </div>
          <div class="control-field">
            <label for="aiSystemPrompt">System Prompt</label>
            <textarea id="aiSystemPrompt" class="ai-textarea" rows="4" spellcheck="false"></textarea>
          </div>
          <div class="control-field">
            <label for="aiUserPrompt">User Prompt 模板（{compound_id}、{text}）</label>
            <textarea id="aiUserPrompt" class="ai-textarea" rows="3" spellcheck="false"></textarea>
          </div>
          <div class="control-toolbar control-toolbar--nested">
            <button type="button" id="btnAiSaveConfig" class="btn-compact">保存 AI 配置</button>
            <button type="button" id="btnAiTest" class="btn-compact">测试连接</button>
            <span id="aiConfigStatus" class="status status--inline"></span>
          </div>
        </div>
      </details>

      <details class="control-group control-group--params match-params" id="matchParamsDetails" open>
        <summary class="match-params-summary">
          <span class="match-params-title">匹配参数</span>
          <span class="match-params-hint">点击展开或折叠</span>
        </summary>
        <div class="match-params-body">
          <div class="control-field">
            <div class="control-row control-row--inputs">
              <label class="label-multi" id="lblMatchX">结构 X 扩展（坐标）</label>
              <div class="match-x-pair">
                <label class="inline-num-label" for="matchXLeft">左</label>
                <input type="number" id="matchXLeft" min="0" max="999999" step="0.1" value="0" title="结构框左侧向左扩展的绝对长度（CDXML 坐标）" />
                <label class="inline-num-label" for="matchXRight">右</label>
                <input type="number" id="matchXRight" min="0" max="999999" step="0.1" value="0" title="结构框右侧向右扩展的绝对长度（CDXML 坐标）" />
              </div>
            </div>
            <p class="field-hint">扩展后再与文字做 X 方向重叠判断；默认 0 / 0 为严格按结构框宽度。</p>
          </div>

          <div class="control-field">
            <div class="control-row control-row--inputs">
              <label for="matchYDown">结构 Y 向下匹配</label>
              <input type="number" id="matchYDown" min="1" max="99999" step="1" value="130" title="HW 与结构中心 Y 差、tPSA/CLogP 与结构中心距离、其他文字与结构底边等，须小于等于该值（坐标单位）" />
            </div>
            <p class="field-hint">CDXML 坐标单位，默认 130。</p>
          </div>
        </div>
      </details>

          <div class="control-toolbar">
        <button type="button" id="btnRun" class="primary">开始解析</button>
        <button type="button" id="btnParseTextAi" disabled>AI 结构化 text</button>
        <button type="button" id="btnExportMain" disabled>导出解析结果 CSV…</button>
        <button type="button" id="btnExportReview" disabled>导出审查清单 CSV…</button>
        <button type="button" id="btnExportStructured" disabled>导出结构化 CSV…</button>
        <span id="status" class="status" role="status"></span>
      </div>
      <div id="aiProgressWrap" class="ai-progress-wrap" hidden>
        <div class="ai-progress-track" aria-hidden="true">
          <div id="aiProgressBar" class="ai-progress-bar"></div>
        </div>
        <span id="aiProgressLabel" class="ai-progress-label"></span>
      </div>
    </div>
  </section>

  <main class="main-area">
    <section class="panel tabs-panel">
      <div class="tab-headers" id="tabHeaders">
        <button type="button" class="tab-btn active" data-tab="results" data-label-base="解析结果">解析结果 (0)</button>
        <button type="button" class="tab-btn" data-tab="hw" data-label-base="未匹配 HW">未匹配 HW (0)</button>
        <button type="button" class="tab-btn" data-tab="struct" data-label-base="未匹配结构">未匹配结构 (0)</button>
        <button type="button" class="tab-btn" data-tab="prop" data-label-base="未用 tPSA/CLogP 行">未用 tPSA/CLogP 行 (0)</button>
        <button type="button" class="tab-btn" data-tab="other" data-label-base="未匹配其他文字">未匹配其他文字 (0)</button>
        <button type="button" class="tab-btn" data-tab="empty" data-label-base="SMILES 为空">SMILES 为空 (0)</button>
        <button type="button" class="tab-btn" data-tab="structured" data-label-base="结构化结果">结构化结果 (0)</button>
      </div>
      <div class="tab-body">
        <div id="tabResults" class="tab-pane active"></div>
        <div id="tabHw" class="tab-pane"></div>
        <div id="tabStruct" class="tab-pane"></div>
        <div id="tabProp" class="tab-pane"></div>
        <div id="tabOther" class="tab-pane"></div>
        <div id="tabEmpty" class="tab-pane"></div>
        <div id="tabStructured" class="tab-pane">
          <div class="structured-toolbar">
            <label for="structuredTableSelect">数据表</label>
            <select id="structuredTableSelect">
              <option value="ic50">IC50</option>
              <option value="auc">AUC₀₋t</option>
              <option value="fu">Fu</option>
              <option value="solubility">Solubility</option>
              <option value="mms">MMS T1/2</option>
              <option value="cyp_inhibition">CYP_inhibition</option>
            </select>
          </div>
          <div id="structuredTableHost"></div>
          <div id="structuredErrors" class="structured-errors"></div>
        </div>
      </div>
    </section>
  </main>

  <footer class="log-footer">
    <button type="button" id="btnToggleLog" class="log-toggle">
      <span class="log-toggle-label">运行日志</span>
      <span id="logToggleHint" class="log-toggle-hint">点击展开</span>
    </button>
  </footer>

  <div id="logOverlay" class="log-overlay" aria-hidden="true">
    <button type="button" class="log-overlay-backdrop" id="logBackdrop" aria-label="关闭"></button>
    <div class="log-overlay-panel" role="dialog" aria-labelledby="logOverlayTitle">
      <div class="log-overlay-header">
        <h2 id="logOverlayTitle">运行日志</h2>
        <button type="button" id="btnCloseLog" class="log-overlay-close">关闭</button>
      </div>
      <pre id="logBox" class="log log-overlay-body"></pre>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
